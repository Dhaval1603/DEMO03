<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap');
      .serif-mm-vert {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        fill: #C8102E;
        letter-spacing: 0.1em;
      }
      .sans-atelier-vert {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        fill: #111111;
        letter-spacing: 0.18em;
      }
      .sans-services-vert {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        fill: #111111;
        letter-spacing: 0.28em;
      }
    </style>

    <pattern id="archHatchVert" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8E8E93" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Architectural Geometric Studio Symbol (Centered on Top, exactly matching Image 1 & 3) -->
  <g transform="translate(45, 10) scale(0.875)">
    <!-- Hatched Quadrant -->
    <rect x="160" y="80" width="80" height="80" fill="#D8D8DC" />
    <rect x="160" y="80" width="80" height="80" fill="url(#archHatchVert)" />
    <rect x="240" y="80" width="80" height="80" fill="#D8D8DC" />
    <rect x="240" y="80" width="80" height="80" fill="url(#archHatchVert)" />
    <rect x="240" y="160" width="80" height="80" fill="#D8D8DC" />
    <rect x="240" y="160" width="80" height="80" fill="url(#archHatchVert)" />

    <!-- Outer Circle -->
    <path d="M 80 80 A 169.7056 169.7056 0 0 0 80 320" stroke="#111111" stroke-width="4.5" stroke-dasharray="14 10" fill="none" stroke-linecap="round"/>
    <path d="M 80 80 A 169.7056 169.7056 0 1 1 80 320" stroke="#111111" stroke-width="4.5" fill="none"/>

    <!-- 3x3 Grey Grid -->
    <rect x="80" y="80" width="240" height="240" fill="none" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="160" y1="80" x2="160" y2="320" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="240" y1="80" x2="240" y2="320" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="80" y1="160" x2="320" y1="160" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="80" y1="240" x2="320" y2="240" stroke="#B0B0B5" stroke-width="2.5" />

    <!-- 9 Diagonals -->
    <line x1="80" y1="80" x2="160" y2="160" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="160" y1="80" x2="240" y2="160" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="240" y1="80" x2="320" y2="160" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="80" y1="160" x2="160" y2="240" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="160" y1="160" x2="240" y2="240" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="240" y1="160" x2="320" y2="240" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="80" y1="240" x2="160" y2="320" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="160" y1="240" x2="240" y2="320" stroke="#B0B0B5" stroke-width="2.5" />
    <line x1="240" y1="240" x2="320" y2="320" stroke="#B0B0B5" stroke-width="2.5" />

    <!-- Bold Red Motif -->
    <g stroke="#C8102E" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
      <polyline points="80,80 160,80 160,240" fill="none" />
      <polygon points="80,160 160,160 160,240" fill="none" />
      <line x1="160" y1="160" x2="240" y2="160" />
      <line x1="240" y1="160" x2="240" y2="320" />
      <polygon points="160,240 240,240 240,320" fill="none" />
      <line x1="240" y1="240" x2="320" y2="240" />
      <line x1="320" y1="240" x2="320" y2="320" />
    </g>
  </g>

  <!-- Typography Below (Centered as in Image 3) -->
  <g transform="translate(220, 420)">
    <!-- Line 1: M M DESIGN ATELIER -->
    <text text-anchor="middle" y="0">
      <tspan class="serif-mm-vert" font-size="32">M M </tspan>
      <tspan class="sans-atelier-vert" font-size="28">DESIGN ATELIER</tspan>
    </text>

    <!-- Line 2: ARCHITECTURE | INTERIOR | LANDSCAPE -->
    <text text-anchor="middle" y="38" class="sans-services-vert" font-size="12">
      ARCHITECTURE | INTERIOR | LANDSCAPE
    </text>
  </g>
</svg>
